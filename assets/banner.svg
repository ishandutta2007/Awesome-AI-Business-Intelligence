<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.6"/>
    </linearGradient>
    
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: url(#titleGradient);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* CSS Animations for dynamic background elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes barGrow1 {
      0%, 100% { height: 120px; y: 180px; }
      50% { height: 160px; y: 140px; }
    }
    @keyframes barGrow2 {
      0%, 100% { height: 180px; y: 120px; }
      50% { height: 130px; y: 170px; }
    }
    @keyframes barGrow3 {
      0%, 100% { height: 90px; y: 210px; }
      50% { height: 150px; y: 150px; }
    }
    @keyframes barGrow4 {
      0%, 100% { height: 210px; y: 90px; }
      50% { height: 170px; y: 130px; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashOffset {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.15; }
      100% { transform: translateY(400px); opacity: 0; }
    }

    .bg-orb-1 { animation: pulseGlow 8s infinite ease-in-out; transform-origin: 200px 100px; }
    .bg-orb-2 { animation: pulseGlow 10s infinite ease-in-out 2s; transform-origin: 1000px 260px; }
    
    .anim-bar-1 { animation: barGrow1 6s infinite ease-in-out; }
    .anim-bar-2 { animation: barGrow2 7s infinite ease-in-out 1s; }
    .anim-bar-3 { animation: barGrow3 5s infinite ease-in-out 0.5s; }
    .anim-bar-4 { animation: barGrow4 8s infinite ease-in-out 1.5s; }

    .p1 { animation: floatParticle 4s infinite ease-in-out; }
    .p2 { animation: floatParticle 6s infinite ease-in-out 1s; }
    .p3 { animation: floatParticle 5s infinite ease-in-out 2s; }
    .p4 { animation: floatParticle 7s infinite ease-in-out 0.5s; }

    .trend-line {
      stroke-dasharray: 1000;
      animation: dashOffset 20s linear infinite;
    }
  </style>

  <!-- 1. Base Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>

  <!-- 2. Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" opacity="0.8"/>

  <!-- 3. Ambient Background Light Orbs (Deep Layer) -->
  <circle class="bg-orb-1" cx="200" cy="100" r="180" fill="#3b82f6" opacity="0.25" filter="url(#glow)"/>
  <circle class="bg-orb-2" cx="1000" cy="260" r="220" fill="#8b5cf6" opacity="0.2" filter="url(#glow)"/>

  <!-- 4. Dynamic Background Graphical Elements (Subtle/Low Opacity behind text overlay) -->
  <g opacity="0.35">
    <!-- Animated Chart Bars (Right Side & Background) -->
    <rect class="anim-bar-1" x="820" y="180" width="36" height="120" rx="6" fill="url(#barGrad1)" />
    <rect class="anim-bar-2" x="870" y="120" width="36" height="180" rx="6" fill="url(#barGrad2)" />
    <rect class="anim-bar-3" x="920" y="210" width="36" height="90" rx="6" fill="url(#barGrad1)" />
    <rect class="anim-bar-4" x="970" y="90" width="36" height="210" rx="6" fill="url(#barGrad3)" />
    <rect class="anim-bar-2" x="1020" y="150" width="36" height="150" rx="6" fill="url(#barGrad2)" />
    <rect class="anim-bar-1" x="1070" y="110" width="36" height="190" rx="6" fill="url(#barGrad3)" />

    <!-- Animated AI Wave / Trend Line -->
    <path class="trend-line" d="M 50 280 Q 200 260, 350 210 T 650 180 T 950 110 T 1150 70" fill="none" stroke="url(#lineGrad)" stroke-width="3" opacity="0.7" filter="url(#glow)" />
    <path d="M 50 280 Q 200 260, 350 210 T 650 180 T 950 110 T 1150 70 L 1150 320 L 50 320 Z" fill="url(#barGrad1)" opacity="0.15" />
  </g>

  <!-- Floating Glowing AI Particles (Middle Layer) -->
  <g filter="url(#glow)">
    <circle class="p1" cx="150" cy="120" r="4" fill="#38bdf8" />
    <circle class="p2" cx="450" cy="80" r="3" fill="#818cf8" />
    <circle class="p3" cx="750" cy="280" r="5" fill="#c084fc" />
    <circle class="p4" cx="1050" cy="140" r="4" fill="#f472b6" />
    <circle class="p1" cx="900" cy="60" r="3" fill="#38bdf8" />
  </g>

  <!-- 5. Foreground Content Layer with Subtle Dark Overlay Backdrop for Perfect Contrast -->
  <!-- Dark Backdrop Card for Text Clarity -->
  <rect x="60" y="50" width="1080" height="260" rx="12" fill="#0f172a" fill-opacity="0.4" stroke="#334155" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Foreground Title and Text -->
  <g transform="translate(100, 0)">
    <!-- Category Badge / Tag -->
    <g transform="translate(0, 95)">
      <rect x="0" y="-18" width="270" height="28" rx="14" fill="#0369a1" fill-opacity="0.4" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="0" class="tag">CURATED ECOSYSTEM &bull; 2026</text>
    </g>

    <!-- Main Title with Glow -->
    <text x="0" y="165" class="title" filter="url(#textGlow)">Awesome AI Business Intelligence</text>
    
    <!-- Subtitle -->
    <text x="0" y="210" class="subtitle">Commercial Platforms &bull; Open-Source Augmented Analytics &bull; AI Copilots</text>

    <!-- Key Feature Pills (Foreground Elements with High Visibility) -->
    <g transform="translate(0, 242)">
      <!-- Pill 1: NLQ & AI Search -->
      <g transform="translate(0, 0)">
        <rect width="160" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="15" cy="15" r="4" fill="#38bdf8"/>
        <text x="28" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">NLQ &amp; AI Search</text>
      </g>
      
      <!-- Pill 2: Automated Insights -->
      <g transform="translate(172, 0)">
        <rect width="175" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="15" cy="15" r="4" fill="#a855f7"/>
        <text x="28" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Automated Insights</text>
      </g>

      <!-- Pill 3: Self-Hosted & OS -->
      <g transform="translate(359, 0)">
        <rect width="165" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="15" cy="15" r="4" fill="#f43f5e"/>
        <text x="28" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Self-Hosted &amp; OS</text>
      </g>

      <!-- Pill 4: Predictive Analytics -->
      <g transform="translate(536, 0)">
        <rect width="180" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="15" cy="15" r="4" fill="#22c55e"/>
        <text x="28" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Predictive Analytics</text>
      </g>
    </g>
  </g>

  <!-- Decorative Border Frame Overlay -->
  <rect x="0" y="0" width="1200" height="360" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2"/>
</svg>
