<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Text Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: url(#titleGradient);
    }

    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 1.5px;
    }

    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 2px;
    }

    /* Subtle background dynamic animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-15px) rotate(180deg); opacity: 0.7; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
    }

    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }

    @keyframes barGrow {
      0%, 100% { transform: scaleY(0.85); }
      50% { transform: scaleY(1.15); }
    }

    .bg-glow-1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }

    .bg-glow-2 {
      animation: pulseGlow 10s ease-in-out infinite 2s;
      transform-origin: 1000px 300px;
    }

    .particle {
      animation: floatParticle 6s ease-in-out infinite;
    }

    .p-delay-1 { animation-delay: 1s; }
    .p-delay-2 { animation-delay: 2.5s; }
    .p-delay-3 { animation-delay: 4s; }

    .animated-line {
      stroke-dasharray: 8 8;
      animation: dashLine 3s linear infinite;
    }

    .chart-bar-1 { animation: barGrow 4s ease-in-out infinite 0s; transform-box: fill-box; transform-origin: bottom; }
    .chart-bar-2 { animation: barGrow 4s ease-in-out infinite 1s; transform-box: fill-box; transform-origin: bottom; }
    .chart-bar-3 { animation: barGrow 4s ease-in-out infinite 2s; transform-box: fill-box; transform-origin: bottom; }
    .chart-bar-4 { animation: barGrow 4s ease-in-out infinite 1.5s; transform-box: fill-box; transform-origin: bottom; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)"/>

  <!-- Dynamic Ambient Glowing Orbs in Deep Background -->
  <g opacity="0.4">
    <circle class="bg-glow-1" cx="200" cy="100" r="180" fill="#3b82f6" filter="url(#glow)"/>
    <circle class="bg-glow-2" cx="1000" cy="300" r="200" fill="#8b5cf6" filter="url(#glow)"/>
  </g>

  <!-- Grid Pattern Overlay in Background -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" />
  </g>

  <!-- Decorative Dynamic Visual Accent Elements (Positioned away from text / low opacity behind card) -->
  <!-- Left Side Floating Dynamic Chart Outline -->
  <g transform="translate(60, 220)" opacity="0.25">
    <rect class="chart-bar-1" x="0" y="30" width="16" height="50" rx="4" fill="#38bdf8"/>
    <rect class="chart-bar-2" x="24" y="10" width="16" height="70" rx="4" fill="#818cf8"/>
    <rect class="chart-bar-3" x="48" y="40" width="16" height="40" rx="4" fill="#c084fc"/>
    <rect class="chart-bar-4" x="72" y="0" width="16" height="80" rx="4" fill="#38bdf8"/>
  </g>

  <!-- Right Side Dynamic Network Nodes -->
  <g opacity="0.3">
    <line class="animated-line" x1="1020" y1="120" x2="1110" y2="180" stroke="#818cf8" stroke-width="2"/>
    <line class="animated-line" x1="1110" y1="180" x2="1050" y2="270" stroke="#c084fc" stroke-width="2"/>
    <circle class="particle p-delay-1" cx="1020" cy="120" r="6" fill="#38bdf8"/>
    <circle class="particle p-delay-2" cx="1110" cy="180" r="8" fill="#818cf8"/>
    <circle class="particle p-delay-3" cx="1050" cy="270" r="5" fill="#c084fc"/>
  </g>

  <!-- Central Foreground Content Box (Guarantees Title & Subtitle visual isolation & priority) -->
  <g filter="url(#dropShadow)">
    <rect x="150" y="60" width="900" height="280" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    
    <!-- Decorative Card Header Accent Line -->
    <path d="M 350,60 L 850,60" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Category Pill Badge -->
    <g transform="translate(475, 95)">
      <rect x="0" y="0" width="250" height="32" rx="16" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      <text x="125" y="21" text-anchor="middle" class="badge-text">CURATED ECOSYSTEM</text>
    </g>

    <!-- FOREGROUND TITLE -->
    <text x="600" y="185" text-anchor="middle" class="title-text" filter="url(#dropShadow)">
      Awesome AI Business Intelligence
    </text>

    <!-- FOREGROUND SUBTITLE -->
    <text x="600" y="235" text-anchor="middle" class="subtitle-text">
      Augmented Analytics • Conversational BI • AI Copilots • Semantic Models
    </text>

    <!-- Subtitle Icons / Tech Stack Pills -->
    <g transform="translate(360, 270)" opacity="0.85">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="140" height="28" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="rgba(255,255,255,0.1)"/>
      <text x="70" y="18" text-anchor="middle" font-family="system-ui" font-size="12" fill="#e2e8f0">📊 LLM &amp; NLQ</text>

      <!-- Tag 2 -->
      <rect x="155" y="0" width="170" height="28" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="rgba(255,255,255,0.1)"/>
      <text x="240" y="18" text-anchor="middle" font-family="system-ui" font-size="12" fill="#e2e8f0">🤖 Autonomous Agents</text>

      <!-- Tag 3 -->
      <rect x="340" y="0" width="140" height="28" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="rgba(255,255,255,0.1)"/>
      <text x="410" y="18" text-anchor="middle" font-family="system-ui" font-size="12" fill="#e2e8f0">🔓 Open Source</text>
    </g>
  </g>
</svg>
